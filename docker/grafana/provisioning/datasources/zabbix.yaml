apiVersion: 1

datasources:
  - name: Zabbix
    uid: zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://zabbix-web:8080/api_jsonrpc.php
    jsonData:
      authType: token
      trends: true
      trendsFrom: '7d'
      trendsRange: '4d'
      cacheTTL: '1h'
      disableReadOnlyUsersAck: false
      disableDataAlignment: false
    secureJsonData:
      apiToken: '${ZABBIX_API_TOKEN}'
    version: 1
    editable: true