services:
  nginx-files:
    image: nginx:alpine
    container_name: nginx-files
    volumes:
      - ./files:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    ports:
      - "8082:80"
    labels:
      - "homepage.group=File Management"
      - "homepage.name=Secure Files"
      - "homepage.icon=sh-lock"
      - "homepage.href=http://localhost:8082"
      - "homepage.description=Password-protected file server"
    networks:
      - homelab-net
    restart: unless-stopped

networks:
  homelab-net:
    external: true