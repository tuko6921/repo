server {
    listen 80;
    server_name _;

    auth_basic "Restricted Files";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        root /usr/share/nginx/html;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location ~ /\.ht {
        deny all;
    }
}