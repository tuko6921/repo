version: '3.8'

services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    user: "1000:1000"
    volumes:
      - ./data/filebrowser.db:/database/filebrowser.db
      - ./data/settings.json:/.filebrowser.json
      - /home/mjward/docker:/srv
    ports:
      - "8080:80"
    labels:
      - "homepage.group=File Management"
      - "homepage.name=FileBrowser"
      - "homepage.icon=/icons/filebrowser.png"
      - "homepage.href=http://localhost:8080"
      - "homepage.description=Web file manager"
    networks:
      - homelab-net
    restart: unless-stopped

networks:
  homelab-net:
    external: true
